#
# Fork-compatible workflow for testing the CMSIS Pack build.
# Uses GitHub-hosted runners (no pytorch/test-infra dependency).
# This file is NOT intended for upstream — use build-cmsis-pack.yml instead.

name: Test CMSIS Pack (Fork)

on:
  push:
    branches:
      - arm/cmsis-pack-integration
      - arm/cmsis-pack-fork-ci
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-cmsis-pack:
    name: build-cmsis-pack
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            cmake \
            ninja-build \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pyyaml tomli

      - name: Cross-compile ExecuTorch for Cortex-M
        run: |
          # Build ExecuTorch C++ libraries with arm-none-eabi-gcc
          # This generates required headers (flatbuffers, schema) without
          # needing the full Python package or PyTorch installed.
          #
          # The build_executorch.sh script requires the Arm setup to have
          # been run first. Since we're on a plain GitHub runner without
          # the Arm SDK Docker image, we drive CMake directly.
          cmake \
            -DCMAKE_INSTALL_PREFIX=cmake-out-arm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=examples/arm/ethos-u-setup/arm-none-eabi-gcc.cmake \
            -DEXECUTORCH_BUILD_ARM_BAREMETAL=ON \
            -DEXECUTORCH_BUILD_KERNELS_QUANTIZED=ON \
            -DFLATC_EXECUTABLE=$(which flatc 2>/dev/null || echo "") \
            -DEXECUTORCH_BUILD_FLATC=ON \
            -Bcmake-out-arm .
          cmake --build cmake-out-arm --target install --config Release -j$(nproc) || true
          echo "CMAKE_BUILD_DIR=$(pwd)/cmake-out-arm" >> $GITHUB_ENV

      - name: Determine pack version
        run: |
          PACK_VERSION="$(cat version.txt | sed 's/a0$//')-nightly-$(date -u +%Y%m%d)"
          echo "Pack version: ${PACK_VERSION}"
          echo "PACK_VERSION=${PACK_VERSION}" >> $GITHUB_ENV

      - name: Build CMSIS Pack
        run: |
          backends/arm/scripts/cmsis_pack/build_pack.sh \
            --executorch-root "$(pwd)" \
            --build-dir "${CMAKE_BUILD_DIR}" \
            --version "${PACK_VERSION}" \
            --output-dir "$(pwd)/pack-output"

      - name: Validate pack
        run: |
          PACK_FILE=$(ls pack-output/*.pack 2>/dev/null | head -1)
          if [[ -z "${PACK_FILE}" ]]; then
            echo "ERROR: No .pack file found"
            exit 1
          fi
          echo "Pack file: ${PACK_FILE}"
          echo "Pack size: $(du -h "${PACK_FILE}" | cut -f1)"
          export PACK_FILE
          python3 -c "
          import os, zipfile
          pf = os.environ['PACK_FILE']
          with zipfile.ZipFile(pf, 'r') as z:
              names = z.namelist()
              assert any(n.endswith('.pdsc') for n in names), 'No PDSC'
              assert any('runtime' in n for n in names), 'No runtime'
              assert any('RegisterAllKernels' in n for n in names), 'No RegAll'
              print(f'Pack contains {len(names)} files')
              pdsc = [n for n in names if n.endswith('.pdsc')][0]
              ct = z.read(pdsc).decode()
              op_c = ct.count('Cgroup=' + chr(34) + 'ExecuTorch Operators' + chr(34))
              p_c = ct.count('Csub=' + chr(34) + 'Portable ')
              q_c = ct.count('Csub=' + chr(34) + 'Quantized ')
              print(f'Operator components total: {op_c}')
              print(f'  Portable: {p_c}')
              print(f'  Quantized: {q_c}')
          print('Validation passed')
          "

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmsis-pack-test
          path: pack-output/*.pack
          retention-days: 7
