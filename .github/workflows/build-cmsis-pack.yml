name: Build CMSIS Pack

on:
  schedule:
    # Nightly at 03:00 UTC, staggered after nightly.yml (02:00) so the
    # shared runner pool isn't hit by both at the same minute.
    - cron: 0 3 * * *
  release:
    # Build and validate the pack when a GitHub Release is published; the
    # tag the release points at drives the pack version via GITHUB_REF
    # below. Attaching the artifact to the release is a manual maintainer
    # step (see the note at the end of this file).
    types: [published]
  push:
    branches:
      - main
      - release/*
    paths:
      - .github/workflows/build-cmsis-pack.yml
      - backends/arm/cmsis_pack/**
      - backends/arm/runtime/**
      - backends/cortex_m/**
      - kernels/portable/**
      - kernels/quantized/**
      - runtime/**
      - schema/**
  pull_request:
    paths:
      - .github/workflows/build-cmsis-pack.yml
      - backends/arm/cmsis_pack/**
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override pack version (e.g., 1.2.0). Leave empty to derive from version.txt'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  build-cmsis-pack:
    name: build-cmsis-pack
    # The reusable workflow needs pytorch's self-hosted runner pool; skip on
    # forks (they exercise the same steps via a fork-local workflow instead).
    if: github.repository == 'pytorch/executorch'
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      runner: linux.2xlarge
      docker-image: ci-image:executorch-ubuntu-22.04-arm-sdk
      submodules: 'recursive'
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      timeout: 60
      upload-artifact: cmsis-pack-artifact
      script: |
        set -eux

        echo "::group::Setup environment"
        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        source .ci/scripts/utils.sh
        install_executorch "--use-pt-pinned-commit"
        echo "::endgroup::"

        echo "::group::Install ARM toolchain"
        .ci/scripts/setup-arm-baremetal-tools.sh
        source examples/arm/arm-scratch/setup_path.sh
        echo "::endgroup::"

        echo "::group::Cross-compile ExecuTorch for Cortex-M"
        # Stage 1: Build core ExecuTorch with arm-none-eabi-gcc
        # This generates required headers (flatbuffers, schema)
        backends/arm/scripts/build_executorch.sh
        # Must match build_executorch.sh's output dir (et_build_root/cmake-out);
        # copy_sources.sh hard-fails if the generated schema headers are absent.
        CMAKE_BUILD_DIR="$(pwd)/arm_test/cmake-out"
        echo "::endgroup::"

        echo "::group::Determine pack version"
        # Derive version from tag, input override, schedule (nightly), or version.txt
        BASE_VER="$(cat version.txt | sed 's/a0$//')"
        if [[ -n "${{ inputs.version_override || '' }}" ]]; then
          PACK_VERSION="${{ inputs.version_override }}"
        elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          # Strip leading 'v' and any -rc suffix for release tags
          PACK_VERSION="${GITHUB_REF#refs/tags/v}"
        elif [[ "${{ github.event_name }}" == "schedule" ]]; then
          PACK_VERSION="${BASE_VER}-nightly-$(date -u +%Y%m%d)"
        else
          PACK_VERSION="${BASE_VER}-dev"
        fi
        echo "Pack version: ${PACK_VERSION}"
        echo "::endgroup::"

        echo "::group::Build CMSIS Pack"
        # Release and nightly builds must fail loudly when the published
        # release history cannot be fetched, instead of shipping a PDSC with
        # an empty <releases> history.
        if [[ "${{ github.event_name }}" == "release" || "${{ github.event_name }}" == "schedule" ]]; then
          export RELEASE_HISTORY_STRICT=1
        fi
        backends/arm/cmsis_pack/scripts/build_pack.sh \
          --executorch-root "$(pwd)" \
          --build-dir "${CMAKE_BUILD_DIR}" \
          --version "${PACK_VERSION}" \
          --output-dir "$(pwd)/artifacts-to-be-uploaded"
        echo "::endgroup::"

        echo "::group::Validate pack"
        # Structural checks plus PACK.xsd schema validation: validate_pack.py
        # runs packchk when it is on PATH. The standalone packchk release does
        # not bundle the schema and looks for it in ../etc/ relative to its
        # binary (error M218 otherwise), so lay it out as bin/ + etc/ with
        # PACK.xsd pinned to a spec commit whose schema covers every core the
        # PDSC names (>= 1.7.60 for Cortex-M52 / Star-MC3).
        curl -sSfL -o /tmp/packchk.tbz2 \
          "https://github.com/Open-CMSIS-Pack/devtools/releases/download/tools%2Fpackchk%2F1.4.5/packchk-1.4.5-linux-amd64.tbz2"
        mkdir -p /tmp/packchk/bin /tmp/packchk/etc
        tar -xjf /tmp/packchk.tbz2 -C /tmp/packchk/bin
        curl -sSfL -o /tmp/packchk/etc/PACK.xsd \
          "https://raw.githubusercontent.com/Open-CMSIS-Pack/Open-CMSIS-Pack-Spec/4fb6d1b00e725b1ed18de223d30526e76ee9e15e/schema/PACK.xsd"
        export PATH="/tmp/packchk/bin:${PATH}"
        python3 backends/arm/cmsis_pack/test/validate_pack.py \
          "$(pwd)/artifacts-to-be-uploaded/PyTorch.ExecuTorch.${PACK_VERSION}.pack"
        echo "::endgroup::"

  # There is intentionally no publish job. The repository's GITHUB_TOKEN can
  # no longer modify releases (organization policy), so attaching the pack and
  # its extracted PyTorch.ExecuTorch.pdsc to the GitHub release is a manual
  # maintainer step: download the cmsis-pack-artifact from the release-tag run
  # of this workflow (or use a verified deliverable bundle) and upload both
  # files to the release with the exact tag the PDSC's release entry names.